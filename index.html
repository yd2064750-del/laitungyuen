<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lai Tung Yuen — Personal Site</title>
<meta name="description" content="個人網站：學術成果與投資研究。">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="">

<!-- ========== 導航 ========== -->
<header class="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="index.html" data-nav-brand>Home</a>
    <nav class="nav__links" aria-label="主導覽">
      <a class="nav__link" data-magnetic href="about.html">About Me</a>
      <a class="nav__link" data-magnetic href="academics.html">Academics</a>
      <a class="nav__link" data-magnetic href="insights.html">Insights</a>
      <!-- 若要放 CV：把 href 改成你的 PDF 路徑，例如 assets/cv.pdf -->
      <a class="nav__link" data-magnetic href="#">CV</a>
    </nav>
    <button class="nav__toggle" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span>
    </button>
  </div>
</header>

<main>

  <!-- ========== Hero：圖片佔據螢幕上方二分之一 ========== -->
  <section class="hero" aria-label="主視覺">
    <div class="hero__media">
      <img src="assets/img/hero.jpg" alt="個人照片" fetchpriority="high">
    </div>
    <div class="hero__scrim"></div>
    <div class="hero__caption">
      <h1 class="hero__title" data-hero-title>你好，我是黎東源！</h1>
      <p class="hero__subtitle" data-hero-subtitle></p>
    </div>
  </section>

  <!-- ========== 最新內容：學術論文 + 投資研究，越新排越上面 ========== -->
  <section class="section wrap" aria-label="最新內容">
    <div class="feed" data-home-feed>
      <!-- 由 app.js 依 content.js 渲染 -->
    </div>
  </section>

  <!-- ========== About Me：大圖 + 簡介 ========== -->
  <section class="about-hero" aria-label="About Me">
    <div class="about-hero__media">
      <img src="assets/img/about.jpg" alt="" loading="lazy" decoding="async">
    </div>
    <div class="about-hero__scrim" aria-hidden="true"></div>
    <div class="about-hero__caption">
      <h2 class="about-hero__title">About Me</h2>
      <div class="about-hero__bio" data-about-intro></div>
      <a class="about-hero__email" href="#" data-email></a>
    </div>
  </section>

</main>

<!-- ========== 頁腳 ========== -->
<footer class="footer">
  <div class="wrap footer__inner">
    <div>&copy; <span data-year>2026</span> <span data-footer-name>Lai Tung Yuen</span>. All rights reserved.</div>
    <div>
      <a href="#" data-email>Email</a> ·
      <a href="about.html">About</a> ·
      <a href="academics.html">Academics</a> ·
      <a href="insights.html">Insights</a>
    </div>
  </div>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
