<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="示意圖：信譽收益與社會成本之間的權衡">
  <rect width="1200" height="675" fill="#f5f5f7"/>
  <g stroke="#1d1d1f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 立柱與底座 -->
    <line x1="600" y1="150" x2="600" y2="530"/>
    <line x1="516" y1="530" x2="684" y2="530"/>
    <!-- 橫樑：右側下沉（社會成本較重） -->
    <line x1="306" y1="206" x2="894" y2="292"/>
    <circle cx="600" cy="249" r="8" fill="#1d1d1f"/>
    <!-- 左盤：吊索 + 開口向上的盤 -->
    <line x1="306" y1="206" x2="306" y2="322"/>
    <line x1="306" y1="322" x2="236" y2="374"/>
    <line x1="306" y1="322" x2="376" y2="374"/>
    <path d="M236 374 Q306 448 376 374"/>
    <!-- 右盤 -->
    <line x1="894" y1="292" x2="894" y2="408"/>
    <line x1="894" y1="408" x2="824" y2="460"/>
    <line x1="894" y1="408" x2="964" y2="460"/>
    <path d="M824 460 Q894 534 964 460"/>
  </g>
  <!-- 左盤：輕（一只空心圓） -->
  <circle cx="306" cy="406" r="24" fill="none" stroke="#1d1d1f" stroke-width="2.5"/>
  <!-- 右盤：重（疊放的實心方塊） -->
  <g fill="#1d1d1f">
    <rect x="862" y="496" width="64" height="15" rx="3"/>
    <rect x="867" y="479" width="54" height="15" rx="3"/>
    <rect x="874" y="462" width="40" height="15" rx="3"/>
  </g>
</svg>
