name: Deploy to GitHub Pages

# 推送到 main 時自動部署；也可以在 Actions 頁面手動觸發
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的推送排隊等待，不取消進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true 會在 Pages 尚未開啟時自動開啟它，
      # 並且把來源設為「GitHub Actions」，不需要手動到 Settings 設定
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 這個站是純靜態檔案，直接整包發佈（排除 .git 與工作流本身）
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
